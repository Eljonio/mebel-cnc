# Цеховые параметры. ВСЕ числа здесь — ДОПУЩЕНИЯ (типовая практика цехов СНГ), пока цех не подтвердил.
# Поменять число = поменять только этот файл: код чисел не держит.
# source: "допущение" — типовая цифра; "по документации" — с ссылкой; "замерено" — рулеткой/на станке.

shop:
  name: "цех не задан"
  source: допущение

materials:
  ldsp16:
    name: "ЛДСП 16 мм (декор с текстурой)"
    kind: ЛДСП
    thickness: 16          # допущение: у поставщика бывает 16 или 18 — брать из задания
    sheet: [2800, 2070]    # допущение: длина вдоль текстуры × ширина (бывает 2750×1830)
    grain: true            # текстура вдоль длины листа (2800)
    color_3d: "#c9a77c"
    source: допущение
  hdf3:
    name: "ХДФ 3 мм белая"
    kind: ХДФ
    thickness: 3
    sheet: [2800, 2070]    # допущение (бывает 2745×1700, 2440×1220)
    grain: false
    color_3d: "#f2f0ea"
    source: допущение

cutting:
  kerf: 4                  # пропил пилы, мм (для фрезерного нестинга = диаметр фрезы, обычно 6–12)
  trim: 10                 # обрезка края листа с каждой стороны, мм
  guillotine: true         # только сквозные резы (форматно-раскроечный станок); для фрезы можно false
  min_part: 70             # деталь уже этого — предупреждение (опасно на пиле, сдувает на вакууме)
  source: допущение

edges:
  # кромка по роли торца: видимый / невидимый / в стык с другой деталью (кромки нет)
  by_role: {visible: 2.0, hidden: 0.4, joint: 0}
  # сколько вычитать из размера детали на каждый кромкованный торец (правило цеха)
  subtract: {"2.0": 2.0, "0.4": 0.0}
  premill: 0               # прифуговка на кромкооблицовочном станке, мм на сторону (у многих 0,5–1)
  piece_allowance: 50      # запас кромки на каждый отрезок, мм (свесы под торцовку)
  tape_width: {"16": 19, "18": 22}   # ширина ленты кромки под толщину плиты, мм
  source: допущение

facades:
  gap: 2                   # зазор между фасадами, мм
  edge_gap: 2              # зазор фасада до края поля (крышка, край корпуса), мм
  source: допущение

carcass:
  plinth_setback: 20       # цоколь утоплен от переднего края корпуса, мм
  shelf_side_gap: 1        # съёмная полка уже проёма на 1 мм с каждой стороны
  shelf_front_setback: 10  # полка отступает от переднего края корпуса
  shelf_back_gap: 2        # зазор полки до задней стенки
  source: допущение

back:
  # накладная: ХДФ прибивается/шурупится на задние торцы; в паз: ХДФ вставляется в паз
  overlay_inset: 2         # накладная меньше корпуса на 2 мм с каждой стороны
  groove_width: 4          # паз под ХДФ 3 мм
  groove_depth: 8
  groove_offset: 10        # от заднего края детали до паза
  groove_clearance: 1      # ХДФ не доходит до дна паза на 1 мм
  fastener_pitch: 120      # шаг гвоздей/саморезов накладной стенки, мм
  source: допущение

fasteners:
  confirmat:
    name: "Конфирмат 7×50"
    face_d: 7              # в пласть, сквозное
    edge_d: 5              # в торец
    length: 50
    edge_extra: 2          # глубина в торец = длина − толщина + запас
    edge_offset: 50        # от края детали до первого конфирмата
    max_pitch: 300         # макс. шаг между конфирматами
    source: допущение
  minifix:
    name: "Эксцентрик (минификс) Ø15 + шток"
    cam_d: 15
    cam_depth: 13
    cam_offset: 34         # от торца детали до центра эксцентрика
    edge_d: 8              # канал из торца к эксцентрику
    bolt_d: 5              # под вкручиваемый шток
    bolt_depth: 11
    source: допущение (зависит от модели фурнитуры)
  dowel:
    name: "Шкант 8×30"
    d: 8
    face_depth: 12
    edge_depth: 20
    source: допущение
  min_wall: 3              # стенка между соседними отверстиями, мм
  min_edge_wall: 2         # стенка от отверстия до края материала (без кромки) и до пласти, мм
  min_bottom: 2            # остаток материала под глухим отверстием, мм

hinges:
  name: "Петля накладная 110° + планка 0 мм"
  cup_d: 35
  cup_depth: 13
  cup_center_from_edge: 22    # центр чашки от края двери (K≈4.5)
  end_offset: 100             # от верха/низа двери до оси петли
  plate_line: 37              # линия отверстий планки от переднего края боковины (система 32)
  plate_pitch: 32
  plate_d: 5
  plate_depth: 12
  zone: 40                    # полка не ближе этого к оси петли (планка + плечо)
  count_by_height:            # макс. высота двери → число петель
    - [900, 2]
    - [1600, 3]
    - [2000, 4]
    - [2400, 5]
  source: допущение (по рекомендациям производителей петель, сверить с фурнитурой цеха)

shelf_pins:
  name: "Полкодержатель Ø5"
  d: 5
  depth: 10
  line: 37                  # от переднего края и от задней стенки
  pitch: 32
  extra_positions: 2        # ±2 шага вокруг основного положения
  drop: 4                   # ось отверстия ниже полки на 4 мм
  source: допущение

handle:
  name: "Ручка-скоба"
  d: 5
  source: допущение (межцентровое из изделия)

# ======================= КУХНЯ (с 27.10.2026) — всё ДОПУЩЕНИЯ, сверить с цехом =======================
kitchen_materials:
  ldsp16_grey:
    name: "ЛДСП 16 мм светло-серая, однотон (пример: Egger U708 ST9 «Светло-серый» — подобрать по каталогу поставщика)"
    kind: ЛДСП
    thickness: 16
    sheet: [2800, 2070]      # допущение (Egger 2800×2070)
    grain: false             # однотон — деталь можно поворачивать при раскрое
    color_3d: "#c9cbca"
    source: допущение
  hdf3_grey:
    name: "ХДФ 3 мм светло-серая (задние стенки)"
    kind: ХДФ
    thickness: 3
    sheet: [2800, 2070]
    grain: false
    color_3d: "#d9dad8"
    source: допущение
  mdf18_beige:
    name: "МДФ 18 мм крашеный, матовый бежевый (пример цвета RAL 1015 «Светлая слоновая кость» — подобрать по каталогу фасадного цеха)"
    kind: МДФ
    thickness: 18
    sheet: [2800, 2070]
    grain: false
    color_3d: "#ddcdb2"
    ral: "RAL 1015"
    source: допущение (фасады заказываются в фасадном цеху по списку размеров)
  worktop38_oak:
    name: "Столешница 38 мм под натуральный дуб (пример: Egger H3303 ST10 «Дуб Гамильтон натуральный»; длины 3050/4100 × 600)"
    kind: столешница
    thickness: 38
    lengths: [3050, 4100]    # допущение: стандартные длины заготовок
    width: 600
    color_3d: "#b8895a"
    source: допущение
  apron6_beige:
    name: "Стеновая панель (фартук) 6 мм светло-бежевая (МДФ/HPL; альтернатива — стекло 6 мм окрашенное)"
    kind: фартук
    thickness: 6
    color_3d: "#ece3d3"
    source: допущение

  mdf18_cream:
    name: "МДФ 18 мм крашеный, матовый светло-кремовый (пример цвета RAL 9001 «Кремово-белый» — подобрать по каталогу фасадного цеха)"
    kind: МДФ
    thickness: 18
    sheet: [2800, 2070]
    grain: false
    color_3d: "#e6dfcf"
    ral: "RAL 9001"
    source: допущение (фасады заказываются в фасадном цеху по списку размеров)
  worktop38_black:
    name: "Столешница 38 мм чёрная матовая (ЛДСП/HPL постформинг, пример: Egger F206/U999 «Чёрный» — подобрать; длины 3050/4100 × 600)"
    kind: столешница
    thickness: 38
    lengths: [3050, 4100]    # допущение: стандартные длины заготовок
    width: 600
    color_3d: "#1c1c1e"
    source: допущение
  apron6_white:
    name: "Фартук 6 мм белый (стекло закалённое крашеное или стеновая панель HPL/МДФ — выбрать)"
    kind: фартук
    thickness: 6
    color_3d: "#f3f2ee"
    source: допущение
kitchen:
  facade_gap: 2              # зазор между соседними фасадами, мм (по 1 мм от границы модуля)
  upper_facade_drop: 20      # фасад верхних ниже корпуса — за край берутся рукой, за свесом LED
  upper_facade_top_gap: 2
  back_inset: 2              # ХДФ накладная меньше корпуса на 2 мм по краям
  rail_width: 100            # царги нижних вместо крыши
  rail_width_hob: 40         # задняя царга под варкой — уже, чтобы не мешать вырезу
  shelf_front_setback: 10
  shelf_back_gap: 2
  shelf_side_gap: 1
  plinth_setback: 50         # цоколь утоплен от плоскости фасадов
  plinth_t: 16               # толщина планки цоколя (ПВХ/алюминий)
  gola_L: {depth: 28, height: 58, gap: 32, name: "Профиль Gola L (верхний горизонтальный), пример Firmax/GTV/Boyard — подобрать", bar: 3000}
  gola_C: {depth: 28, height: 70, gap: 32, name: "Профиль Gola C (средний горизонтальный, между ящиками)", bar: 3000}
  drawer:
    system: "Ящик на металлических боковинах с доводчиком, направляющие полного выдвижения 500 мм (тип Blum TANDEMBOX antaro / GTV Modern Box / Boyard — подобрать)"
    runner: 500
    bottom_w_minus: 75       # дно = внутренняя ширина − 75 (ДОПУЩЕНИЕ по формуле Blum TANDEMBOX; сверить с каталогом системы)
    bottom_l_minus: 24       # длина дна = длина направляющей − 24
    back_w_minus: 87         # задняя стенка = внутренняя ширина − 87
    back_h_by_facade: [[200, 68], [300, 84], [9999, 116]]   # высота фасада -> высота задней стенки ящика
    min_space: 90            # меньше этого по высоте ящик на металлических боковинах не встаёт
    bottom_clear: 14         # дно ящика выше дна корпуса
    above_profile: 6         # дно ящика выше верха профиля Gola C
  # Без ручек и без профиля Gola: открывание нажатием (TIP-ON). Числа — допущения до сверки с цехом/Blum.
  push:
    top_gap: 3               # фасад нижних ниже столешницы на 3 мм (иначе при нажатии трётся о свес)
    door_name: "TIP-ON для распашных дверей, короткий (накладные двери до ~1300 мм), пример Blum TIP-ON + адаптер"
    hinge_name: "Петля накладная 110° БЕЗ пружины (под TIP-ON), планка 0 мм (Blum: TIP-ON — с CLIP top без пружины)"
    drawer_name: "TIP-ON BLUMOTION для ящиков (открывание нажатием + плавное закрывание), пример Blum — под систему ящиков"
    tipon_per_door: [[9999, 1]]   # по 1 на дверь (допущение: у Blum число по весу/высоте не нашли; до ~1300 — короткий)
    drawer_gap: 3            # зазор между фасадами ящиков: Blum TIP-ON BLUMOTION — не меньше 2,5 мм (каталог Blum 2022, с.247)
    rail_edge_h: 100         # царга «на ребро» под мойкой (высота)
    oven_top_gap: 2          # верх ниши духовки ниже столешницы
  legs: {height: 100, per_module: 4, per_wide: 6, wide_from: 900, name: "Опора регулируемая 100 мм (95–130) с клипсой цоколя"}
  plinth: {name: "Цоколь ПВХ/алюминий 100 мм серый", bar: 4000}
  led:
    name_profile: "Профиль алюминиевый накладной для LED-ленты с рассеивателем (под шкафом)"
    name_strip: "LED-лента 24 В, ~9,6 Вт/м, тёплый белый 3000–4000 K"
    watt_per_m: 9.6
    psu_margin: 1.25
    strip_reel: 5000
    profile_bar: 2000
    y_from_front: 30         # ось профиля от лица корпуса верхнего
  worktop:
    end_strip: "Планка торцевая для столешницы 38 мм (алюминий)"
    joint_strip: "Планка соединительная для столешницы 38 мм (или «евро-запил» на ЧПУ)"
    wall_strip: "Плинтус пристеночный для столешницы (алюминий/ПВХ)"
    sink_from_front: 80      # передний край мойки от края столешницы (больше обычных 50 — позади профиль Gola)
    hob_from_front: 50
    saw: 4
  hangers: {name: "Навес регулируемый скрытый для верхних шкафов + монтажная шина", per_cabinet: 2}
  hinges_note: "Петля накладная 110° с доводчиком, планка 0 мм (пример Blum CLIP top BLUMOTION / Hettich Sensys — подобрать)"
  bifold_hinge: "Петля для складной двери «гармошка» (створка к створке) с доводчиком"
  ties_per_joint: 3          # стяжка межсекционная на стык соседних корпусов
  worktop_fix_per_module: 4
  source: допущение
