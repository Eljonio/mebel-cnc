    - "Фасады — МДФ матовый, без ручек (открываются нажатием)"
    - "Столешница 38 · мойка врезная · газовая панель 4 конфорки · СВЧ встраиваемая"
  photo_caption: >-
    Демо-пример с выдуманными размерами. Сверху — модель, по которой считаются детали, снятая с того же ракурса,
    что и эскиз слева.
  views_caption: >-
    Картинки построены из модели. Цвета — примерные, оттенок выбирается по образцам.
  cap_A: >-
    Длинная стена, вид из комнаты: угол слева, холодильник справа. Слева высоты от пола, сверху ширины верхних, снизу —
    нижних. Пунктирный треугольник на двери — вершиной к петлям. Номера в кружках — точки воды, газа, розеток и
