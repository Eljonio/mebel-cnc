  cap_B: >-
    Левая стена, вид из комнаты: угол справа, межкомнатная дверь слева. Клетчатое — ряд длинной стены в разрезе.
  legend:
    - [Н1, "нижний угловой 1250 под мойку: у угла глухая часть за посудомойкой, планка 50, две двери"]
    - [Н2, "три ящика (фасады 1 : 1 : 2)"]
    - [Н3, "духовка, над ней газовая панель; внизу съёмная панель"]
    - [Н4, "нижний 400, за дверью кран газа"]
    - [Н5, "нижний 350 у холодильника, петли слева"]
    - [Н6, "посудомойка 45, полностью встраиваемая"]
    - [Н7, "нижний 500, две двери"]
    - [ХЛ, "холодильник отдельностоящий 600"]
    - [В1, "верхний угловой: глухой квадрат 350 в углу + дверь"]
    - ["В2–В4, В6", "верхние с полками 450, 300, 300, 400"]
    - [В5, "шкаф вытяжки над варкой"]
    - [В7, "верхний 350 у холодильника, петли слева, видимая боковина в цвет фасадов"]
    - ["В8, В9", "верхние 300 над посудомойкой"]
    - [В10, "ниша под встраиваемую СВЧ, над ней две двери"]
    - ["Т1, Т3", "торцевые панели МДФ в цвет фасадов"]
    - [П, "планка до потолка"]
  modules_note: >-
    Нижние: корпус 720 на ножках 122 (регулируются), фасады 717 (на 3 ниже столешницы), глубина корпуса 560 + фасад 18,
    столешница 600. Верхние: корпус 1000, фасады 1018 — на 20 ниже корпуса, за этим свесом подсветка; глубина 332 + 18 =
    350. Зазор между фасадами 2 мм, между фасадами ящиков 3. X — вдоль длинной стены от угла, Y — вдоль левой от угла.
  facades_note: >-
    МДФ 18 мм, гладкий, матовый, покраска по кругу; видимые боковина, торцы и планки — с двух сторон. Чашки петель
    Ø35 сверлятся в дверях со стороны петель (22 мм от края, высоты — в файлах для сверления).
  appliances:
    fridge: "Глубина 650 и высота 2000 — сверить по модели; дверь открывается к правой стене."
    hob: "Газ подключает только газовая служба: кран в Н4 за дверью, гибкая металлическая подводка через боковину Н4. Нужна розетка 220 В для поджига (шнур 1 м) — за духовкой."
    oven: "Ниша 568 × 600 × 560 (инструкция: 560–568 × 600–604 × ≥550, сзади ≥20). Розетка 16 А за духовкой в разрешённой инструкцией зоне. Под нишей — съёмная панель."
    dw: "Фасад 448 × 717 при цоколе 122 (по инструкции 655–725 при цоколе 90–220). Без ручки — нужна модель с открыванием нажатием или ручка на фасаде. Розетка в соседнем Н7."
    mw: "Только встраиваемая для навесного шкафа 60 см (класс Bosch BFL623MB3 / BFL524MS0): задняя стенка в нише снята, розетка в шкафу над нишей."
    hood: "Телескопическая в шкаф 600 (класс Bosch DFS067A51): дно шкафа снято, воздуховод Ø150 к вентканалу. Над газом нужно ≥650 — см. «Важно»."
    sink: "Врезная, смеситель на столешнице; вырез по шаблону мойки."
  critical:
    - "Газ подключает только газовая служба. Кран перед панелью должен быть доступен — он в шкафу Н4 за дверью. Подводка — металлический гибкий шланг или труба, не касается ящиков (под панелью духовка, ящиков нет). В новых домах обязателен датчик загазованности с отсечным клапаном (Требования по безопасности объектов газоснабжения, приказ МВД РК № 673, пп. 232–233)."
    - "Розетки нужны до монтажа кухни: без 220 В не работает поджиг газовой панели. Где каждая — на плане: духовка и поджиг за духовкой (зона, разрешённая её инструкцией), посудомойка в Н7, СВЧ, вытяжка и блок подсветки — в верхних шкафах, холодильник — за ним, рабочие — над столешницей. Розетки не ближе 0,5 м к крану газа."
    - "Без ручек: двери открываются нажатием (TIP-ON) и закрываются рукой — плавного закрывания на дверях нет. Ящики — нажатием и с плавным закрыванием. Посудомойке без ручки нужна модель с открыванием нажатием, иначе ручка на её фасаде."
    - "СВЧ — только встраиваемая для шкафа 60 см. Отдельностоящую СВЧ в закрытую нишу не ставить: ей нужен зазор для вентиляции."
  deviations:
    - ["Угловой: две двери до самого фасада посудомойки", "Тот же корпус: у угла планка 50, петли левой двери — на стойке внутри", "Дверь с петлями у угла при открытии бьёт фасад посудомойки, который стоит к ней под 90°"]
    - ["Шкафы у холодильника с петлями справа", "Нижний и верхний 350 с петлями слева; у верхнего правая боковина — МДФ в цвет фасадов", "Холодильник глубже и выше шкафов: дверь с петлями справа упёрлась бы в его бок"]
    - ["СВЧ в открытой нише", "Ниша под встраиваемую СВЧ 60, рамка 595×382; над нишей две двери", "Размеры ниши по инструкции производителя"]
    - ["Шкаф вытяжки — дверь как у соседних", "Дверь короче, под ней выдвижной экран вытяжки 40", "Телескопическая вытяжка выдвигает экран под дверью"]
    - ["Под духовкой — ящик", "Съёмная панель", "Ниша духовки по инструкции — 600 до столешницы; ящик не встаёт"]
  questions:
    - "Газ или индукция? С газом шкаф вытяжки поднимаем на 70 мм (его дверь короче) — иначе нарушение инструкции вытяжки и газовой панели. С индукцией оставляем как есть."
    - "Потолок 2600 — точно? Замер в 3–4 точках: планка до потолка подрезается по месту."
    - "Ручки: без ручек (нажатием) — подтверждаете? С профилем-ручкой или ручками двери будут с плавным закрыванием."
    - "Столешница: ЛДСП/HPL 38 или кварц? У кварца другая толщина — пересчитаем высоту корпуса."
