# Демо-кухня (синтетический пример, все размеры выдуманы): Г-образная, без ручек (TIP-ON), газовая панель,
# встраиваемая СВЧ в верхнем шкафу, угловой нижний под мойку, планка до потолка, присадка и DXF (второй этап).
# Размеры в мм. Оси как в kuhnya-g.yaml: X вдоль стены A (задняя, длинная) от угла A/B, Y вдоль стены B (левая)
# в комнату (0 — плоскость стены A), Z от пола.
# Нижние A: 1250 + 600 + 600 + 400 + 350 = 3200 до холодильника; ряд B: 450 + 500 = 950 после угла 600 (итого 1550).
# Пересобрать: python -m mebel.kitchen products/kuhnya-demo.yaml [--preview | --render]
kitchen:
  id: kuhnya-demo
  name: "Кухня Г-образная 3200 × 1550 (демо: без ручек, газ, СВЧ)"
  prefix: D
  corner: AB
  corner_owner: A       # угловой нижний (под мойку) стоит в ряду A, ряд B пристыкован к его глухой части
  opening: push         # без ручек и без профиля Gola — открывание нажатием (TIP-ON)
  hob: gas              # газовая варочная 4 конфорки
  source_word: "эскизу"
  drilling: true        # второй этап: присадка корпусов и фасадов -> DXF по слоям (станок не задан, G-code нет)

room:                   # помещение условное: длины стен, окно, дверь, точки — для картинки и проверок
  a: 4100               # стена A: 3200 + 10 + холодильник 600 + ~290
  b: 3300               # стена B (глубина комнаты)
  height: 2600
  wall: 200
  window: {wall: C, y0: 1000, width: 1400, z0: 850, height: 1500}   # окно на правой стене
  door: {from_corner: AB, offset: 1900, width: 800, height: 2050}   # межкомнатная дверь на левой стене за концом кухни
  decor:                # шторы — только картинка
    - {name: "Штора", wall: C, mat: curtain, box: [4000, 4090, 800, 1220, 0, 2580]}
    - {name: "Штора", wall: C, mat: curtain, box: [4000, 4090, 2180, 2600, 0, 2580]}
  points:               # точки коммуникаций условные — на реальном объекте сверить с электриком и газовой службой
    - {id: water, kind: water, name: "Вода и канализация", wall: A, pos: 900, z: 450}
    - {id: gas, kind: gas, name: "Газ: кран перед варочной", wall: A, pos: 2650, z: 700, d: 40}
    - {id: pw_oven, kind: power, name: "Розетка духовки 16 А (за духовкой)", wall: A, pos: 2130, z: 290}
    - {id: pw_ign, kind: power, name: "Розетка поджига газовой панели (за духовкой)", wall: A, pos: 2290, z: 290}
    - {id: pw_dw, kind: power, name: "Розетка ПММ", wall: B, pos: 1200, z: 300}
    - {id: pw_fridge, kind: power, name: "Розетка холодильника", wall: A, pos: 3500, z: 300}
    - {id: pw_mw, kind: power, name: "Розетка СВЧ (в шкафу над нишей)", wall: B, pos: 1400, z: 2150}
    - {id: pw_hood, kind: power, name: "Розетка вытяжки и блока LED (в шкафу вытяжки)", wall: A, pos: 2320, z: 2230}
    - {id: pw_work1, kind: power, name: "Розетки рабочие (двойная)", wall: A, pos: 1530, z: 1100}
    - {id: pw_work2, kind: power, name: "Розетки рабочие (двойная)", wall: B, pos: 1300, z: 1100}
    - {id: vent, kind: vent, name: "Вывод вентиляции", wall: A, pos: 2150, z: 2400, d: 150}

# 880 = цоколь 122 + корпус 720 + столешница 38. Верхние: фасады 1500..2518, корпус 1520..2520 (фасад на 20 ниже —
# за ним LED). Вытяжка — по линии фасадов (1500): над газом мало, см. проверку «газ».
heights: {plinth: 122, lower_carcass: 720, worktop: 38, upper_bottom: 1520, upper_top: 2520, hood_bottom: 1500,
          upper_facade_drop: 20, ceiling_strip: {gap: 2}}
depths: {lower_carcass: 560, worktop: 600, upper_carcass: 332, facade: 18}

materials: {carcass: ldsp16_grey, back: hdf3_grey, facade: mdf18_beige, worktop: worktop38_oak, apron: apron6_beige}
look:                   # цвета картинки
  facade: "#ddcdb2"
  plinth: "#ddcdb2"
  worktop: "#b8895a"
  apron: "#ece3d3"

# hinge: corner — петли со стороны угла, far — с дальней от угла стороны
lower_a:                # вдоль стены A от угла A/B
  start: 0
  modules:
    - {id: Н1, type: corner_sink, width: 1250, filler: 50, doors: 2, pipe_cut: [650, 1180, 130, 700]}
    - {id: Н2, type: drawers, width: 600, fronts_ratio: [1, 1, 2]}
    - {id: Н3, type: oven, width: 600}
    - {id: Н4, type: doors, width: 400, doors: 1, hinge: corner, shelves: 1, note: "кран газа на стене за дверью"}
    - {id: Н5, type: doors, width: 350, doors: 1, hinge: corner, shelves: 1,
       note: "петли слева — дверь открывается от холодильника"}
    - {id: ХЛ, type: fridge, width: 600, in_run: false, gap: 10}
lower_b:                # вдоль стены B: первые 600 — глухая часть Н1 (Y 0..600)
  start: 600
  modules:
    - {id: Н6, type: dishwasher, width: 450}
    - {id: Н7, type: doors, width: 500, doors: 2, shelves: 1}
  end_panel: true       # торец МДФ 18 снаружи: 1550 + 18 = 1568
  worktop_end: 1570     # длина столешницы по B, торцевая кромка
upper_a:
  start: 0
  modules:
    - {id: В1, type: corner_blind_u, width: 800, blind: 350, hinge: far, shelves: 2}
    - {id: В2, type: shelves, width: 450, hinge: corner, shelves: 2}
    - {id: В3, type: shelves, width: 300, hinge: far, shelves: 2}
    - {id: В4, type: shelves, width: 300, hinge: corner, shelves: 2}
    - {id: В5, type: hood, width: 600, hinge: far}
    - {id: В6, type: shelves, width: 400, hinge: corner, shelves: 2}
    - {id: В7, type: shelves, width: 350, hinge: corner, shelves: 2, mdf_side: R, side_note: "над холодильником"}
upper_b:
  start: 350            # угловой квадрат 350×350 — глухая часть В1
  modules:
    - {id: В8, type: shelves, width: 300, hinge: far, shelves: 2}
    - {id: В9, type: shelves, width: 300, hinge: corner, shelves: 2}
    - {id: В10, type: microwave, width: 600, doors: 2, shelves: 1}
  end_panel: true       # торец МДФ 18 снаружи, до потолка

appliances:             # размеры ниш — по открытым инструкциям Bosch (класс техники, не конкретная покупка)
  fridge: {w: 600, h: 2000, d: 650, wall_gap: 50, hinge: far, mat: steel_fridge, split: 860, handles: false,
           dispenser: [1650, 1820]}
  # духовка HBA534BS0: ниша под столешницей 560(+8) × 600(+4) × ≥550, фасад 595, корпус 570, сзади ≥20 (9001577968_B, с.24)
  oven: {w: 600, h: 595, niche_h: 600, body_top_drop: 25, d: 548, handle: true,
         socket_zone: {from_left: 180, from_right: 60, h: 115}}   # розетка за духовкой — заштрихованная зона (с.23)
  # газовая PNP6B6B90/PGP6B5B90: вырез 560×480–490, корпус 45 от верха столешницы (38 + 7), решётки ~30 над стеклом
  hob: {type: gas, w: 590, d: 520, cutout: [560, 490], body_h: 7, grate_h: 30}
  # ПММ SPV2HKX42E: ниша 815–875 × 450 × ≥550; цоколь 90–220; фасад 655–725 (спецификация, с.3)
  dishwasher: {w: 450, niche_min: 815, niche_max: 875, facade_max: 725, facade_h: [655, 725],
               facade_src: "Bosch SPV2HKX42E, спецификация", door_t: 22}
  sink: {w: 500, d: 450, center: auto, bowl: 190, rim: 18, from_front: 50, mat: granite_black, mat_bowl: granite_black,
         faucet_mat: faucet_black, faucet_h: 320, spout_down: true}
  # вытяжка DFS067A51: над газом ≥650, над электро/индукцией ≥430; шкаф 600, глубина ≥320, дно убрать; корпус ниже шкафа
  # на 41, экран 40; отверстие Ø170 в 198 от переднего края (9001527975_L, с.9–12; спецификация DFS067A51B)
  hood: {type: telescopic, w: 600, h: 426, below: 41, visor_h: 40, duct: 150, duct_from_front: 198, body_w: 524, body_d: 290}
  # СВЧ BFL623MB3 / BFL524MS0: ниша 560(+8) × 362–365 × ≥320 (BFL524 ≥300), задняя стенка за прибором открыта,
  # рамка 595×382 ниже пола ниши на 14 (9001610734_F с.20–21; спецификации)
  microwave: {niche_h: 363, front_h: 382, front_w: 595, front_t: 20, front_below: 14, body: [560, 362, 315],
              back_cut: true, niche_w: [560, 568], niche_h_range: [362, 365], depth_min: 320,
              src: "Bosch BFL623MB3/BFL524MS0"}

gas:                    # газ: нормы и инструкции
  hood_min: 650
  hood_min_electric: "≥430 (Bosch DFS067A51)"
  hood_src: "Bosch DFS067A51, инструкция 9001527975 рис. 13.2; панель BSH 8001317828 рис. 1 — 650 от уровня решёток; при расхождении берётся большее"
  upper_side_min: [0, 400]         # навесные сбоку: не ниже 400 над столешницей (BSH 8001317828 рис. 1)
  hose_max: 1500
  hose_src: "Требования МВД РК № 673 длину бытовой подводки не задают — практика газовых служб, сверить"
  socket_min: 500
  socket_src: "практика газовых служб — сверить с газовой службой"
  valve_module: "Н4 (за дверью)"

targets: {lower_a: 3200, lower_b: 1550, upper_a: 3200, upper_b: 1550, worktop_z: 880}

# Камера «с ракурса эскиза»: условная точка из дальнего угла комнаты (за стеной D — стену прячем).
# Все кадры 16:9. closed — «закрытый» вид для рендера: комната вокруг камеры продлевается (стена D условная),
# потолок, пол ёлочкой; в 3D-просмотре такие камеры прячут стену D.
cameras:
  photo: {pos: [3500, 4200, 1600], target: [2900, 3000, 1500], lens: 24, shift_x: 0, res: [1920, 1080],
          fov_h: 70, hide: ["D"], closed: true, title: "С ракурса эскиза"}
  front: {pos: [1900, 4600, 1420], target: [1900, 0, 1420], lens: 30, shift_y: -0.04, res: [1920, 1080],
          hide: ["D"], closed: true, title: "Спереди, на длинную стену"}
  angle: {pos: [1100, 4600, 1450], target: [2000, 600, 1450], lens: 23, res: [1920, 1080],
          hide: ["D"], closed: true, title: "От двери на кухню"}
  top: {pos: [2050, 1250, 6000], target: [2050, 1250, 0], ortho: 4600, res: [1920, 1080], hide: [], plan: true,
        clip: 1500, clip_kinds: [wall, window, door], clip_drop: [door_leaf], hide_above: 1400,
        title: "План сверху (верхние шкафы и стены выше 1,5 м убраны)"}

# Картинка (только рендер Blender): материалы, комната, свет. Мебель не меняет.
render:
  look: {facade: "#ddd0b8", worktop: "#a77b50", apron: "#eee7da", fridge: "#7f7c78", wall: "#dcdcd8",
         ceiling: "#f5f5f3", curtain: "#cfcac0"}
  floor: {type: herringbone, plank: [560, 90], gap: 1.6,
          tones: ["#b7a387", "#a99579", "#c1ad90", "#9f8b70", "#b19d81", "#c8b699", "#a48f73"]}
  board: "#4f4236"
  window: [1000, 2400, 850, 2350]     # окно на стене C: Y от, до, Z от, до (как room.window)
  sun: 2.0
  sun_elev: 26
  sun_az: 22
  window_power: 260
  fill: 70
  sky: "#d3e0ee"
  sky_strength: 0.35
  led_k: 4000
  led_strength: 6
  led_w_per_m: 10
  exposure: -1.2
  decor:
    - {type: board, at: [1700, 85, 880], size: [300, 420, 18], lean: 9}
    - {type: vase, at: [2950, 190, 880], r: 55, h: 210, color: "#eceae4"}

