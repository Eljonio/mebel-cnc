# Кухня Г-образная по тестовому ТЗ (пример, размеры условные). Размеры в мм.
# Оси: X вдоль стены A (0 — угол A/B, левый, если смотреть на A из комнаты), Y вдоль стены B в комнату
# (0 — плоскость стены A), Z вверх от пола. Стена B — X=0, стена C — X=a, стена D — Y=b. Стены уходят наружу.
# Пересобрать: python -m mebel.kitchen products/kuhnya-g.yaml
kitchen:
  id: kuhnya-g
  name: "Кухня Г-образная 3000 × 1800"
  prefix: K
  corner: AB            # угол, где сходятся ряды: AB (принято) | AC (запасной вариант, если дверь как в ТЗ дословно)

room:
  a: 4200               # длина стены A (по X)
  b: 3100               # длина стены B (по Y)
  height: 2700
  wall: 200
  window: {x0: 2200, width: 1500, z0: 900, height: 1400}       # на стене A; подоконник на 900
  # Дверь на стене B. from_corner: BD — проём отсчитан от угла B/D (Y 2200..3000) — ПРИНЯТО;
  # AB — от угла A/B, как в ТЗ дословно (Y 100..900): тогда Г-кухня в углу A/B невозможна (проверка покажет).
  door: {from_corner: BD, offset: 100, width: 800, height: 2100}
  points:
    - {id: water, name: "Вода и канализация", wall: A, pos: 700, z: 500}
    - {id: hob_power, name: "Розетка варочной панели", wall: A, pos: 1800, z: 300}
    - {id: vent, name: "Вывод вентиляции", wall: A, pos: 1800, z: 2300, d: 150}
    - {id: fridge_power, name: "Розетка холодильника", wall: B, pos: 1500, z: 300, assumed: "Y в ТЗ не задан — по центру холодильника"}

heights: {plinth: 100, lower_carcass: 762, worktop: 38, upper_bottom: 1500, upper_top: 2400, hood_bottom: 1600}
depths: {lower_carcass: 560, worktop: 600, upper_carcass: 332, facade: 18}

materials: {carcass: ldsp16_grey, back: hdf3_grey, facade: mdf18_beige, worktop: worktop38_oak, apron: apron6_beige}

# hinge: corner — петли со стороны угла, far — с дальней от угла стороны
lower_b:                # вдоль стены B от угла A/B
  - {id: Н1, type: corner_blind, width: 1150, blind: 600, shelves: 1, hinge: far}
  - {id: F1, type: filler, width: 50}            # доборная планка: дверь Н1 не цепляет холодильник при открытии
  - {id: ХЛ, type: fridge, width: 600}
lower_a:                # вдоль стены A после углового участка (X 0..600 занят глухой частью Н1)
  start: 600
  modules:
    - {id: Н2, type: sink, width: 600, hinge: corner}
    - {id: Н3, type: cargo, width: 300}
    - {id: Н4, type: oven, width: 600}
    - {id: Н5, type: dishwasher, width: 600}
    - {id: Н6, type: drawers, width: 300, drawers: [176, 245, 245]}   # фасады ящиков сверху вниз, между ними профиль C
  end_panel: true       # торцевая панель МДФ на открытый торец X=3000 (снаружи модулей)
upper_a:
  start: 0
  modules:
    - {id: В1, type: corner_l, width: 600}       # Г-образный 600×600, складная дверь «гармошка»
    - {id: В2, type: dryer, width: 600, hinge: corner}
    - {id: В3, type: shelves, width: 300, shelves: 2, hinge: far}
    - {id: В4, type: hood, width: 600, hinge: far}
  end_panel: true       # торец В4 у окна: МДФ 18 снаружи ряда (до откоса остаётся 82)
upper_b:
  start: 600
  modules:
    - {id: В5, type: shelves, width: 550, shelves: 2, hinge: far}
    - {id: F2, type: filler, width: 50}
  end_panel: true       # торец над холодильником: МДФ 18 возвратом за планкой F2 (на холодильник не выходит)

appliances:
  fridge: {w: 600, h: 2000, d: 650, wall_gap: 50, hinge: far}
  oven: {w: 600, h: 600, d: 550}
  hob: {w: 600, d: 520, cutout: [560, 490], body_h: 55}
  dishwasher: {w: 600, niche_min: 815, niche_max: 875, facade_max: 730}
  sink: {w: 500, d: 400, center: 900, bowl: 180, rim: 18}
  hood: {w: 600, h: 180, duct: 150}

# Длины рядов по ТЗ (после решений по противоречиям): проверка «сумма модулей»
targets: {lower_a: 3000, lower_b: 1800, upper_a: 2100, upper_b: 1200}
