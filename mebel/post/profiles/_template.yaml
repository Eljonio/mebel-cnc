# Шаблон профиля станка. Скопировать в <станок>.yaml и заполнить ПО ФОТО таблички/пульта и словам оператора.
# status: confirmed ставится только после сверки с оператором станка и холостого прохода.
status: draft
model: ""              # табличка станка, например "XX-1325 nesting"
controller: ""         # NcStudio/Weihong, Syntec, DSP (Richauto), Biesse bSolid, Homag woodWOP ...
file_format: ""        # .nc / .tap / .mpr / .bpp / .xxl / DXF напрямую — по примеру файла с флешки
work_area: []          # [X, Y, Z] мм
zero: ""               # "левый нижний угол листа, Z0 = верх листа" или "Z0 = стол"
tool_change: ""        # ATC (автомат, сколько гнёзд) / вручную
drill_unit: ""         # сверлильная голова: сколько вертикальных, есть ли горизонтальные
spoilboard: ""         # жертвенный стол, допустимый проход ниже листа, мм
vacuum: ""             # вакуумный стол, зоны
tools: []              # - {n: 1, type: фреза компрессионная, d: 6, rpm: 18000, feed: 8000, plunge: 2000}
header_template: ""    # шапка в начале файла (изделие, дата, материал, толщина, ноль, инструмент)
